<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margin Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: notes list on the left, the paper on a grey desk on the right; answers float on the page beside the box you drew. */
:root {
  --desk: #e4e6eb;
  --panel: #f7f8fa;
  --ink: #1c2230;
  --muted: #5b6475;
  --line: #d3d7df;
  --accent: #2a52be;
  --accent-soft: rgba(42, 82, 190, .10);
  --card: #ffffff;
  --danger: #b3261e;
  --mark: #2a52be;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --prose: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #12151b; --panel: #1a1e26; --ink: #e5e8ef; --muted: #9aa2b3; --line: #2c323d;
    --accent: #8aa5f7; --accent-soft: rgba(138, 165, 247, .16); --card: #1f242d; --danger: #f07a72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #12151b; --panel: #1a1e26; --ink: #e5e8ef; --muted: #9aa2b3; --line: #2c323d;
  --accent: #8aa5f7; --accent-soft: rgba(138, 165, 247, .16); --card: #1f242d; --danger: #f07a72;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--desk); color: var(--ink); font: 14px/1.45 var(--ui); overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: var(--side-w, 290px) 1fr; grid-template-rows: auto 1fr; height: 100%; }
.app > .side { grid-column: 1; grid-row: 2; position: relative; }
.app > .viewer { grid-column: 2; grid-row: 2; min-width: 0; }
.app.no-side { grid-template-columns: 0 1fr; }
.app.no-side .side, .app.no-side .resizer { display: none; }
.resizer { grid-column: 1; grid-row: 2; justify-self: end; width: 9px; margin-right: -5px; z-index: 15; cursor: col-resize; position: relative; touch-action: none; }
.resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: transparent; transition: background .12s; }
.resizer:hover::after, .resizer.drag::after { background: var(--accent); width: 2px; left: 3.5px; }
body.resizing { cursor: col-resize; user-select: none; }

header.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 600; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand .dot { width: 10px; height: 10px; border: 2px solid var(--accent); border-radius: 2px; }
.bar .grow { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 10px; line-height: 1.2; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #10152a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #10152a; } }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--accent-soft); border-color: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.icon { position: relative; display: inline-grid; place-items: center; padding: 5px 8px; }
.btn.icon .badge { position: absolute; top: -6px; right: -7px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: #fff; font: 600 10px/16px var(--ui); text-align: center; font-variant-numeric: tabular-nums; }
.btn.icon.busy svg { animation: pulse 1.1s ease-in-out infinite; }
select.btn { max-width: 340px; }
.zoom { display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.zoom span { min-width: 46px; text-align: center; color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; }

.side { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 4px 2px 0; font-weight: 600; }
.notelist { display: flex; flex-direction: column; gap: 4px; }
.ni { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 7px 8px; }
.ni:hover { background: var(--accent-soft); }
.ni.active { border-color: var(--accent); background: var(--accent-soft); }
.ni .num { grid-row: span 2; align-self: start; min-width: 22px; height: 22px; border-radius: 4px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.ni .pg { font-size: 12px; color: var(--muted); }
.ni .q { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ni.pending .num { background: var(--muted); }
.empty-side { color: var(--muted); font-size: 13px; padding: 4px 2px; }
.opt { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }

.viewer { overflow: auto; position: relative; }
.pages { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 22px 16px 120px; }
.page { position: relative; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 6px 20px rgba(0,0,0,.08); flex: none; }
.page canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.page .pnum { position: absolute; left: -44px; top: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.overlay { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }

.mark { position: absolute; border: 2px solid var(--mark); background: rgba(42, 82, 190, .07); border-radius: 3px; cursor: pointer; }
.mark:hover, .mark.open { background: rgba(42, 82, 190, .14); }
.mark .tag { position: absolute; left: -2px; top: -22px; height: 20px; min-width: 20px; padding: 0 6px; border-radius: 4px 4px 4px 0; background: var(--mark); color: #fff; font: 600 12px/20px var(--ui); text-align: center; }
.mark.draft { border-style: dashed; cursor: crosshair; }
.mark.pending .tag::after { content: " …"; }

.card, .composer { position: absolute; z-index: 5; width: 420px; max-width: calc(100% - 16px); background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 8px; box-shadow: 0 10px 34px rgba(0,0,0,.22); cursor: auto; }
.card.top { z-index: 6; }
.card header, .composer header { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px; border-bottom: 1px solid var(--line); cursor: grab; user-select: none; }
.card header .t, .composer header .t { font-weight: 600; font-size: 13px; }
.card header .s { color: var(--muted); font-size: 12px; }
.card header .grow { flex: 1; }
.iconbtn { border: 0; background: transparent; padding: 3px 7px; border-radius: 5px; color: var(--muted); font-size: 13px; }
.iconbtn:hover { background: var(--accent-soft); color: var(--ink); }
.iconbtn.warn { color: var(--danger); }
.thread { max-height: min(62vh, 640px); overflow: auto; padding: 4px 14px 10px; }
.qa { padding: 10px 0; border-bottom: 1px dashed var(--line); }
.qa:last-child { border-bottom: 0; }
.qa .q { font-size: 13px; color: var(--muted); margin-bottom: 6px; white-space: pre-wrap; }
.qa .q b { color: var(--accent); font-weight: 600; }
.ans { font: 15px/1.6 var(--prose); overflow-wrap: anywhere; }
.ans p { margin: 0 0 .7em; max-width: 65ch; }
.ans p:last-child { margin-bottom: 0; }
.ans ul, .ans ol { margin: 0 0 .7em; padding-left: 1.3em; }
.ans li { margin: .2em 0; }
.ans code { font-size: 13px; background: var(--accent-soft); padding: 0 3px; border-radius: 3px; }
.ans pre { overflow-x: auto; background: var(--accent-soft); padding: 8px; border-radius: 6px; }
.ans h1, .ans h2, .ans h3, .ans h4 { font: 600 14px/1.3 var(--ui); margin: .9em 0 .4em; }
.ans mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 2px 0; }
.ans blockquote { margin: 0 0 .7em; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
.thinking { color: var(--muted); font: 14px var(--ui); display: flex; align-items: center; gap: 8px; }
.thinking::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
@media (prefers-reduced-motion: reduce) { .thinking::before { animation: none; } }
.err { color: var(--danger); font-size: 13px; margin-top: 6px; }
.fig { margin: 10px 0 12px; }
.fig img { display: block; width: 100%; height: auto; border-radius: 6px; background: #fff; border: 1px solid var(--line); cursor: zoom-in; }
.fig figcaption { font: 12.5px/1.4 var(--ui); color: var(--muted); margin-top: 5px; }
.fig details { margin-top: 4px; font: 12px var(--ui); color: var(--muted); }
.fig summary { cursor: pointer; }
.fig pre { max-height: 260px; font-size: 12px; }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(10, 12, 18, .78); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.lightbox img { max-width: min(1100px, 100%); max-height: 100%; background: #fff; border-radius: 8px; }
.pycheck { position: fixed; right: 16px; bottom: 16px; z-index: 70; width: 360px; max-height: 70vh; overflow: auto; background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.pycheck .log div { padding: 2px 0; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
.mnote { position: absolute; z-index: 2; box-sizing: border-box; overflow: hidden; color: rgb(28, 59, 140); background: rgb(243, 246, 253); border: solid rgb(158, 179, 227); font-family: MQNote, "DejaVu Sans Condensed", "Arial Narrow", sans-serif; white-space: pre; cursor: pointer; box-shadow: 0 1px 2px rgba(20, 40, 100, .10); }
.mnote:hover { background: rgb(232, 238, 252); border-color: rgb(42, 82, 190); }
.mbar { position: absolute; z-index: 2; width: 0; border-left: solid rgba(51, 84, 184, .9); pointer-events: none; }
details.opts { margin-top: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
details.opts summary { cursor: pointer; padding: 8px 10px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; user-select: none; }
details.opts summary::-webkit-details-marker { display: none; }
details.opts summary::before { content: "▸"; font-size: 11px; transition: transform .15s; }
details.opts[open] summary::before { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { details.opts summary::before { transition: none; } }
details.opts .optbody { display: flex; flex-direction: column; gap: 10px; padding: 2px 10px 10px; }
.plotopt { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.qa .by { margin-top: 6px; font-size: 11px; color: var(--muted); text-align: right; letter-spacing: .02em; }
#modelSel { max-width: 220px; }
.toggle { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; user-select: none; white-space: nowrap; }
.toggle:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.followup, .composer .body { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
.composer .body { border-top: 0; }
textarea { width: 100%; resize: vertical; min-height: 38px; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--panel); line-height: 1.4; }
textarea:focus { border-color: var(--accent); outline: none; }
textarea.defq::placeholder { color: var(--ink); opacity: .82; }
.row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.row .grow { flex: 1; }
.kbd { font-size: 12px; color: var(--muted); }

.center-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; }
.center-msg .box { max-width: 460px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.center-msg h1 { font: 600 20px/1.3 var(--ui); margin: 0; text-wrap: balance; }
.center-msg p { margin: 0; color: var(--muted); }
.banner { position: sticky; top: 0; z-index: 8; background: var(--accent-soft); border-bottom: 1px solid var(--line); padding: 6px 14px; font-size: 13px; backdrop-filter: blur(6px); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: 90vw; }
input[type=file] { display: none; }

@media (max-width: 820px) {
  .app { grid-template-columns: 0 1fr; }
  .app .side { display: none; }
  .resizer { display: none; }
  .app.side-open .side { display: flex; position: fixed; z-index: 20; top: 50px; bottom: 0; left: 0; width: 290px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .hint { display: none; }
  .page .pnum { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <button class="btn ghost" id="sideBtn" title="Show or hide the notes list" aria-label="Toggle notes list">☰</button>
    <div class="brand"><span class="dot" aria-hidden="true"></span>Margin Questions</div>
    <select class="btn" id="paperSel" aria-label="Paper" hidden></select>
    <button class="btn" id="openBtn">Open PDF…</button>
    <div class="zoom">
      <button class="btn ghost" id="zOut" aria-label="Zoom out">−</button>
      <span id="zLbl">100%</span>
      <button class="btn ghost" id="zIn" aria-label="Zoom in">+</button>
      <button class="btn ghost" id="zFit" title="Fit page width">Fit</button>
    </div>
    <button class="btn icon" id="dlBtn" title="Download the PDF with margin notes" aria-label="Download the PDF with margin notes"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 14.5v1.5h12v-1.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="badge" id="dlCount" hidden></span></button>
    <input type="file" id="fileIn" accept="application/pdf,.pdf">
    <span class="grow"></span>
    <label class="toggle" title="Short answers: a few sentences, only the key equation"><input type="checkbox" id="concise"> Concise</label>
    <select class="btn" id="modelSel" aria-label="Model used for answers" title="Model used for new answers">
      <option value="opus" title="Most careful">Opus 5.5</option>
      <option value="sonnet" title="Faster">Sonnet 5.5</option>
    </select>
  </header>
  <aside class="side" id="side">
    <h2 id="notesHead">Notes</h2>
    <div class="notelist" id="noteList"><div class="empty-side">No notes yet. Drag a box over anything unclear in the paper.</div></div>
    <details class="opts" id="opts">
      <summary>Options</summary>
      <div class="optbody">
        <label class="opt"><input type="checkbox" id="histDefault" checked> <span>Include my earlier notes on the same page. Helps with follow-ups like “same symbol as before?”</span></label>
        <label class="opt"><input type="checkbox" id="autoMargin"> <span>Let Claude add a margin note on its own when an answer is worth keeping on the page. Off: only when you ask.</span></label>
      </div>
    </details>
  </aside>
  <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize the notes panel" tabindex="0" title="Drag to resize · double-click to reset"></div>
  <main class="viewer" id="viewer">
    <div class="banner" id="banner" hidden></div>
    <div class="pages" id="pages"></div>
    <div class="center-msg" id="center"><div class="box"><h1>Loading…</h1></div></div>
  </main>
</div>

<script>
window.MathJax = {
  tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]], processEscapes: true },
  svg: { fontCache: "global" },
  options: { enableMenu: false },
  startup: { typeset: false, ready() { MathJax.startup.defaultReady(); MathJax.startup.promise.then(() => typesetAllLater()); } }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" async></script>
<script>
"use strict";
/* ---------- setup ---------- */
const $ = (id) => document.getElementById(id);
if (!window.pdfjsWorker && window["pdfjs-dist/build/pdf.worker"]) window.pdfjsWorker = window["pdfjs-dist/build/pdf.worker"];
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const S = {
  db: null, sample: null, assets: null, imagesOK: false, persist: false,
  papers: [], paper: null, pdf: null, pages: [], scale: 1.3, fitScale: 1.3,
  notes: new Map(), openIds: new Set(), activeId: null, docText: "",
  cropCache: new Map(), composer: null, observer: null,
};
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
$("histDefault").checked = LS.get("mq.hist", true);
$("histDefault").onchange = (e) => LS.set("mq.hist", e.target.checked);

const MODELS = {
  opus: { id: "claude-opus-5-5", tier: "complex", label: "Opus 5.5" },
  sonnet: { id: "claude-sonnet-5-5", tier: "default", label: "Sonnet 5.5" },
};
S.model = MODELS[LS.get("mq.model", "opus")] ? LS.get("mq.model", "opus") : "opus";
$("modelSel").value = S.model;
$("modelSel").onchange = (e) => { S.model = e.target.value; LS.set("mq.model", S.model); };

S.concise = !!LS.get("mq.concise", false);
$("concise").checked = S.concise;
$("concise").onchange = (e) => { S.concise = e.target.checked; LS.set("mq.concise", S.concise); };

S.autoMargin = LS.get("mq.autoMargin2", false) === true;
$("autoMargin").checked = S.autoMargin;
$("autoMargin").onchange = (e) => { S.autoMargin = e.target.checked; LS.set("mq.autoMargin2", S.autoMargin); };
$("dlBtn").onclick = () => exportPdf();
const MOD = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? "⌘" : "Ctrl+";
function sendHint(extra) { return "↵ ask" + (S.toolsOK ? ` · ${MOD}↵ ask with a plot` : "") + " · ⇧↵ new line" + (extra || ""); }
function isSendKey(e) { return e.key === "Enter" && !e.isComposing && !e.shiftKey && !e.altKey; }
function wantsPlotKey(e) { return !!(S.toolsOK && (e.metaKey || e.ctrlKey)); }

function toast(msg, ms = 4200) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function centerMsg(title, text, withOpen) {
  const c = $("center"); c.hidden = false;
  c.innerHTML = `<div class="box"><h1>${esc(title)}</h1>${text ? `<p>${esc(text)}</p>` : ""}${withOpen ? '<button class="btn primary" id="centerOpen">Open a PDF</button>' : ""}</div>`;
  if (withOpen) $("centerOpen").onclick = () => $("fileIn").click();
}
function hideCenter() { $("center").hidden = true; }
function banner(text) { const b = $("banner"); b.hidden = !text; b.textContent = text || ""; }

/* ---------- markdown + math ---------- */
let typesetChain = Promise.resolve();
function typeset(el) {
  if (!window.MathJax || !MathJax.typesetPromise) return;
  typesetChain = typesetChain.then(() => (el.isConnected ? MathJax.typesetPromise([el]) : null)).catch(() => {});
}
function typesetAllLater() { document.querySelectorAll(".ans").forEach((el) => typeset(el)); }
const MATH_RE = /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|(?<![\\$])\$(?![\s$])(?:[^$\n\\]|\\.)+?(?<!\s)\$)/g;
const FIG_RE = /\[\[\s*fig(?:ure)?\s*(\d+)\s*\]\]/gi;
function figSrc(f) { return f.src || (f.assetId ? "/_blob/" + f.assetId : f.dataUrl || ""); }
function figureHTML(f) {
  if (!f) return "";
  const src = figSrc(f);
  const img = src ? `<img src="${esc(src)}" alt="${esc(f.caption || "Figure " + f.n)}" loading="lazy">` : `<div class="err">This figure wasn't saved.</div>`;
  return `<figure class="fig" data-fig="${f.n}">${img}${f.caption ? `<figcaption>${esc(f.caption)}</figcaption>` : ""}`
    + (f.code ? `<details><summary>Python code</summary><pre><code>${esc(f.code)}</code></pre></details>` : "") + `</figure>`;
}

/* ---------- pages ---------- */
async function buildPages() {
  const wrap = $("pages");
  wrap.innerHTML = "";
  S.pages = [];
  if (S.observer) S.observer.disconnect();
  S.observer = new IntersectionObserver((ents) => {
    for (const en of ents) if (en.isIntersecting) renderPage(S.pages[+en.target.dataset.i]);
  }, { root: $("viewer"), rootMargin: "800px 0px" });
  const first = await S.pdf.getPage(1);
  const vw = $("viewer").clientWidth - 40;
  const v1 = first.getViewport({ scale: 1 });
  S.fitScale = Math.max(0.6, Math.min(2.2, vw / v1.width));
  S.scale = LS.get("mq.scale", null) || Math.min(S.fitScale, 1.6);
  for (let i = 1; i <= S.pdf.numPages; i++) {
    const page = i === 1 ? first : await S.pdf.getPage(i);
    const vp1 = page.getViewport({ scale: 1 });
    const el = document.createElement("div");
    el.className = "page"; el.dataset.i = i - 1; el.id = "page-" + i;
    el.innerHTML = `<span class="pnum">p. ${i}</span><canvas></canvas><div class="overlay" data-page="${i}"></div>`;
    wrap.appendChild(el);
    const info = { num: i, page, w: vp1.width, h: vp1.height, el, canvas: el.querySelector("canvas"), overlay: el.querySelector(".overlay"), renderedAt: 0, task: null, items: [], text: "" };
    S.pages.push(info);
    bindOverlay(info);
    S.observer.observe(el);
  }
  applyScale();
}
function applyScale() {
  $("zLbl").textContent = Math.round(S.scale * 100) + "%";

    p.el.style.width = Math.round(p.w * S.scale) + "px";
    p.el.style.height = Math.round(p.h * S.scale) + "px";
    p.renderedAt = 0;
  }
  // render visible ones again
  const vr = $("viewer").getBoundingClientRect();
  for (const p of S.pages) {
    const r = p.el.getBoundingClientRect();
    if (r.bottom > vr.top - 800 && r.top < vr.bottom + 800) renderPage(p);
  }
  for (const id of S.openIds) placeCard(S.notes.get(id));

}
async function renderPage(p) {
  if (!p || p.renderedAt === S.scale) return;

  p.renderedAt = scale;
  if (p.task) { try { p.task.cancel(); } catch {} }
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const vp = p.page.getViewport({ scale: scale * dpr });

}

/* ---------- text ---------- */
async function extractText() {
  const parts = [];
  for (const p of S.pages) {
    try {
      const tc = await p.page.getTextContent();
      const vp1 = p.page.getViewport({ scale: 1 });
      let txt = "";
      p.items = tc.items.filter((it) => "str" in it).map((it) => {
        const [x, y] = vp1.convertToViewportPoint(it.transform[4], it.transform[5]);
        txt += it.str + (it.hasEOL ? "\n" : "");
        return { s: it.str, x: x / p.w, y: y / p.h, w: (it.width || 0) / p.w, h: (it.height || 10) / p.h, eol: it.hasEOL };
      });
      p.text = txt.replace(/[ \t]+\n/g, "\n").trim();
    } catch { p.text = ""; }
    parts.push(`[Page ${p.num}]\n${p.text}`);
  }
  S.docText = parts.join("\n\n");
  computeTextBounds();
  renderAllMargins();
}
function regionText(p, r) {
  const out = [];
  for (const it of p.items) {
    const cx = it.x + it.w / 2, cy = it.y - it.h / 2;
    if (cx >= r.x - 0.005 && cx <= r.x + r.w + 0.005 && cy >= r.y - 0.005 && cy <= r.y + r.h + 0.005) out.push(it.s + (it.eol ? "\n" : " "));
  }

/* ---------- drawing a box ---------- */
function bindOverlay(p) {
  const ov = p.overlay;
  let start = null, draft = null;
  ov.addEventListener("pointerdown", (e) => {
    if (e.target !== ov || e.button !== 0) return;
    e.preventDefault();
    closeComposer(true);
    const b = ov.getBoundingClientRect();
    start = { x: (e.clientX - b.left) / b.width, y: (e.clientY - b.top) / b.height };
    draft = document.createElement("div"); draft.className = "mark draft";
    ov.appendChild(draft);
    ov.setPointerCapture(e.pointerId);
    upd(e);
  });
  function rectFrom(e) {
    const b = ov.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (e.clientX - b.left) / b.width));
    const y = Math.max(0, Math.min(1, (e.clientY - b.top) / b.height));
    return { x: Math.min(x, start.x), y: Math.min(y, start.y), w: Math.abs(x - start.x), h: Math.abs(y - start.y) };
  }
  function upd(e) { const r = rectFrom(e); setBox(draft, r); }
  ov.addEventListener("pointermove", (e) => { if (start) upd(e); });
  ov.addEventListener("pointerup", (e) => {
    if (!start) return;
    const r = rectFrom(e); start = null;
    const b = ov.getBoundingClientRect();
    if (r.w * b.width < 12 || r.h * b.height < 10) { draft.remove(); draft = null; return; }
    openComposer(p, r, draft); draft = null;
  });
  ov.addEventListener("pointercancel", () => { start = null; if (draft) draft.remove(); draft = null; });
}
function setBox(el, r) {

  el.style.width = r.w * 100 + "%"; el.style.height = r.h * 100 + "%";
}

function positionBox(el, p, rect, pos) {

  const r = { l: rect.x * W, t: rect.y * H, r: (rect.x + rect.w) * W, b: (rect.y + rect.h) * H };
  let left, top;

  else if (r.l - 12 - cw >= 0) { left = r.l - 12 - cw; top = r.t; }
  else { left = Math.max(8, Math.min(W - cw - 8, r.l)); top = r.b + 10; }

/* ---------- notes ---------- */

  let timer;
  const timeout = new Promise((res) => { timer = setTimeout(() => res("timeout"), 10000); });
  const got = await Promise.race([S.db.collection("notes").where("paperId", "==", S.paper.id).get().catch((e) => ({ err: e })), timeout]);
  clearTimeout(timer);
  if (got === "timeout") { banner("Your saved notes can't be reached right now. New notes may not save."); return; }
  if (got.err) { banner("Your saved notes didn't load (" + (got.err.code || "error") + ")."); return; }

    const n = { id: d.id, ...JSON.parse(JSON.stringify(d.data())) };

}

function renderThread(n) {

const PY_WORKER_URL = "py/worker.js"; // Python runs from the artifact's own files

    if (d.type === "ready") { PY.ready = true; pyLog("ready after " + Math.round((Date.now() - PY.startedAt) / 1000) + " s"); return; }

    inputSchema: { type: "object", properties: {
      code: { type: "string", description: "Complete Python code that builds the figure." },
      caption: { type: "string", description: "One short sentence saying what the figure shows." } }, required: ["code"] },
    async execute(input, ctx) {

const PLOT_RULES = `

The reader asked for a visual. Use the plot tool to draw it with Python. Only numpy and matplotlib are available: no scipy, sympy or pandas, so solve equations with numpy (for example a simple bisection or fixed-point loop).
- Plot what helps the explanation most: the key function, a comparative static, a numerical example of the mechanism. Pick illustrative parameter values and say they are illustrative.
- One figure per tool call; at most 2 figures. Keep the default figure size and colors.

/* ---------- asking Claude ---------- */
async function cropBlob(n) {
  if (S.cropCache.has(n.id)) return S.cropCache.get(n.id);
  const p = S.pages[n.page - 1];
  const pad = 0.012;
  const r = { x: Math.max(0, n.rect.x - pad), y: Math.max(0, n.rect.y - pad) };
  r.w = Math.min(1 - r.x, n.rect.w + 2 * pad); r.h = Math.min(1 - r.y, n.rect.h + 2 * pad);
  let sc = Math.min(5, Math.max(2.5, 1500 / (r.w * p.w)));
  while (p.w * sc * p.h * sc > 2.6e7) sc *= 0.85;
  const vp = p.page.getViewport({ scale: sc });
  const full = document.createElement("canvas");
  full.width = Math.floor(vp.width); full.height = Math.floor(vp.height);
  const fctx = full.getContext("2d"); fctx.fillStyle = "#fff"; fctx.fillRect(0, 0, full.width, full.height);
  await p.page.render({ canvasContext: fctx, viewport: vp }).promise;
  const out = document.createElement("canvas");
  out.width = Math.max(1, Math.round(r.w * full.width)); out.height = Math.max(1, Math.round(r.h * full.height));
  out.getContext("2d").drawImage(full, r.x * full.width, r.y * full.height, out.width, out.height, 0, 0, out.width, out.height);
  const blob = await new Promise((res) => out.toBlob(res, "image/png"));
  S.cropCache.set(n.id, blob);
  return blob;
}
function buildFirstTurn(n) {

    const others = [...S.notes.values()].filter((o) => o.id !== n.id && o.page === n.page && o.num < n.num && o.messages.some((m) => m.role === "assistant"))
      .sort((a, b) => a.num - b.num).slice(-6);

      earlier = others.map((o) => {
        const q = o.messages[0].content || "(explain this passage)";
        const a = (o.messages.find((m) => m.role === "assistant") || {}).content || "";

<paper title="${S.paper.name || "Untitled"}">
${paper}
</paper>

<marked_area page="${n.page}">
${region || "(no extractable text — rely on the image)"}
</marked_area>

${S.concise
